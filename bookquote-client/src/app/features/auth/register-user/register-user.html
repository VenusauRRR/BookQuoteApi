<app-navbar></app-navbar>

<div>
  <h1>Registration</h1>
  <p>Please fill in the form below to register:</p>

  <form (ngSubmit)="registerUser()">
    <label for="username">Username:</label>
    <input id="username" type="text" name="username" [(ngModel)]="user.username" />

    <br />
    <label for="email">Email:</label>
    <input id="email" type="text" name="email" [(ngModel)]="user.email" />

    <br />
    <label for="password">Password:</label>
    <input id="password" type="password" name="password" [(ngModel)]="user.password" />

    <br />

    <button type="submit">Register</button>
  </form>

</div>
