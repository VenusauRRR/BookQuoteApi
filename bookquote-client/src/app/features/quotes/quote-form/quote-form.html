<p>quote-form works!</p>

<h1>{{ quoteId ? 'Edit' : 'Add' }} Quote</h1>

<form (ngSubmit)="saveQuote()">
  <label for="quoteId" [textContent]="this.quoteId">QuoteId:</label>

  <br />

  <label for="quoteText">Quote Text:</label>
  <input id="quoteText" type="text" name="quoteText" [(ngModel)]="quote.quoteText" />

  <br />

  <button type="submit">{{ quoteId ? 'Update' : 'Add' }}</button>
</form>
