<h1>My Quotes!</h1>
<button type="button" (click)="addQuote()">Add Quote</button>

<p>Number of quotes: {{ quotes.length }}</p>

@for (quote of quotes; track quote.id) {
<div>
  <p class="quote-text">{{ quote.quoteText }}</p>
  <button type="button" (click)="deleteQuote(quote.id)">Delete</button>
  <button type="button" (click)="updateQuote(quote)">Edit</button>
</div>
}
