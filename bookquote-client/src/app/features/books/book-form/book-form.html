<p>book-form works!</p>

<h1>{{ bookId ? 'Edit' : 'Add' }} Book</h1>

<form (ngSubmit)="saveBook()">
  <label for="bookId" [textContent]="this.bookId">BookId:</label>

  <br />

  <label for="title">Title:</label>
  <input id="title" type="text" name="title" [(ngModel)]="book.title" />

  <br />

  <label for="author">Author:</label>
  <input id="author" type="text" name="author" [(ngModel)]="book.author" />

  <br />

  <label for="publicationDate">Publication Date:</label>
  <input id="publicationDate"
         type="date"
         name="publicationDate"
         [(ngModel)]="book.publicationDate" />

  <br />

  <button type="submit">{{ bookId ? 'Update' : 'Add' }}</button>
</form>
