<h1>My Books <i class="fa-brands fa-leanpub text-primary"></i></h1>
<div class="d-flex justify-content-center" >
  <button name="btnGroup" type="button" class="btn" (click)="addBook()">
    <i class="fa-solid fa-plus"></i>
    Add Book
  </button>
</div>


<p>Number of books: {{ books.length }}</p>

<div class="list-group">
  @for (book of books; track book.id) {
  <div class="list-group-item justify-content-between d-flex">
    <div>
      <h5>{{ book.title }}</h5>
      <p>
        Author: {{ book.author }}<br />
        Published: {{ book.publicationDate | date:'dd/MM/yyyy'}}
      </p>
    </div>

    <div>
      <button type="button" class="btn btn-sm" (click)="updateBook(book)"><i class="fa-regular fa-pen-to-square"></i></button>
      <button type="button" class="btn btn-sm" (click)="deleteBook(book.id)"><i class="fa-solid fa-trash"></i></button>

    </div>
    </div>
  }
</div>
