<h1>My Books :)</h1>
<button type="button" (click)="addBook()">Add Book</button>

<p>Number of books: {{ books.length }}</p>

@for (book of books; track book.id) {
<div>
  <h2>{{ book.title }}</h2>
  <p>Author: {{ book.author }}</p>
  <p>Published: {{ book.publicationDate | date:'dd/MM/yyyy'}}</p>
  <button type="button" (click)="deleteBook(book.id)">Delete</button>
  <button type="button" (click)="updateBook(book)">Edit</button>
</div>
}
